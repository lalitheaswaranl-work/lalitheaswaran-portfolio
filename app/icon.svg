<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Deep Luxury Cobalt-to-Slate Background -->
    <linearGradient id="cleanLogoBg" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="45%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Specular Rim Highlight -->
    <linearGradient id="cleanRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.1" />
    </linearGradient>

    <!-- Monogram Pure White-Platinum Face -->
    <linearGradient id="cleanLFace" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Subtle Tech Cyan Bevel Gradient -->
    <linearGradient id="cleanBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Ambient Elevation Shadow -->
    <filter id="cleanClayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#090D16" flood-opacity="0.35" />
    </filter>

    <!-- Clean Letterform Drop Shadow -->
    <filter id="cleanLShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B132B" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect
    x="6"
    y="6"
    width="108"
    height="108"
    rx="28"
    fill="url(#cleanLogoBg)"
    filter="url(#cleanClayShadow)"
  />

  <!-- Chamfered Specular Rim Hairline -->
  <rect
    x="7.5"
    y="7.5"
    width="105"
    height="105"
    rx="26.5"
    fill="none"
    stroke="url(#cleanRimGrad)"
    stroke-width="1.5"
  />

  <!-- 3D Depth Extrusion Shadow for "L" -->
  <path
    d="M 45, 27
       A 9 9 0 0 1 54, 36
       L 54, 73
       A 6 6 0 0 0 60, 79
       L 79, 79
       A 9 9 0 0 1 88, 88
       A 9 9 0 0 1 79, 97
       L 60, 97
       A 24 24 0 0 1 36, 73
       L 36, 36
       A 9 9 0 0 1 45, 27
       Z"
    fill="#080E1E"
    opacity="0.5"
    transform="translate(0, 3)"
  />

  <!-- Sculpted Iconic "L" Monogram -->
  <path
    d="M 45, 25
       A 9 9 0 0 1 54, 34
       L 54, 71
       A 6 6 0 0 0 60, 77
       L 79, 77
       A 9 9 0 0 1 88, 86
       A 9 9 0 0 1 79, 95
       L 60, 95
       A 24 24 0 0 1 36, 71
       L 36, 34
       A 9 9 0 0 1 45, 25
       Z"
    fill="url(#cleanLFace)"
    filter="url(#cleanLShadow)"
  />

  <!-- Top Edge Specular Light Reflection -->
  <path
    d="M 37, 34
       A 9 9 0 0 1 45, 25
       A 9 9 0 0 1 53, 34"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.8"
  />

  <!-- Inner Tech Accent Core: Luminous Cyan Chamfer Highlight -->
  <path
    d="M 54, 69
       A 6 6 0 0 0 60, 77
       L 78, 77"
    stroke="url(#cleanBevelGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
  />
</svg>
